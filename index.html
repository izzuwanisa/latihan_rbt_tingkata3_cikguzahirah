<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#172334;--mut:#627184;--line:#d9e1eb;--pri:#2463a6;--sel:#eaf3ff;--ok:#197448;--bad:#b42318;--okb:#e6f6ee;--badb:#fdecea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1823;--card:#18232f;--ink:#e6edf5;--mut:#9fb0c3;--line:#2b3a4b;--pri:#4a90d9;--sel:#1d3550;--ok:#4ac98b;--bad:#ff8a80;--okb:#12352a;--badb:#3b1d1b}}
:root[data-theme=dark]{--bg:#0f1823;--card:#18232f;--ink:#e6edf5;--mut:#9fb0c3;--line:#2b3a4b;--pri:#4a90d9;--sel:#1d3550;--ok:#4ac98b;--bad:#ff8a80;--okb:#12352a;--badb:#3b1d1b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(120deg,#123052,#2463a6);color:#fff;padding:20px 16px}h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;opacity:.9}
main{max-width:860px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}button.s{background:var(--sel);color:var(--ink)}
input[type=text],textarea,select,input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}.tabs button{flex:1}.tabs .on{background:var(--pri);color:#fff}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}.opt b{min-width:1.3em}.opt:has(input:checked){background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okb);border-color:var(--ok);cursor:default}.opt.no{background:var(--badb);border-color:var(--bad);cursor:default}
.row{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}@media(max-width:560px){.row{grid-template-columns:1fr}}
.mut{color:var(--mut);font-size:.9rem}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:var(--pri);width:0}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.hid{display:none}pre{white-space:pre-wrap;font:inherit;margin:6px 0}.big{font-size:1.8rem;font-weight:800}p{margin:6px 0}
.tw{overflow-x:auto;margin:8px 0}.tb{border-collapse:collapse;margin:0 auto}.tb th,.tb td{border:1px solid var(--ink);padding:5px 10px;text-align:left;vertical-align:top}.tb th{text-align:center}
figure{margin:8px 0;text-align:center}figure img{max-width:100%;height:auto;background:#fff;border-radius:6px}
</style></head><body>

const A=[{"s": "Antara berikut yang manakah maksud mekatronik?", "o": ["Reka bentuk produk atau sistem yang menggabungkan disiplin ilmu elektrik dan pengaturcaraan untuk mencapai tujuan yang dikehendaki.", "Reka bentuk produk atau sistem yang menggabungkan disiplin ilmu elektrik, mekanikal, dan pengaturcaraan untuk mencapai tujuan yang dikehendaki.", "Reka bentuk produk atau sistem yang menggabungkan disiplin ilmu elektrik, mekanikal, elektronik dan pengaturcaraan untuk mencapai tujuan yang dikehendaki.", "Reka bentuk produk atau sistem yang menggabungkan disiplin ilmu elektrik, mekanikal, elektronik, kawalan dan pengaturcaraan untuk mencapai tujuan yang dikehendaki."]}, {"s": "Pilih padanan yang tepat tentang elemen mekatronik.", "t": "<div class=\"tw\"><table class=\"tb\"><thead><tr><th></th><th>Elemen</th><th>Pernyataan</th></tr></thead><tbody><tr><td>I</td><td>Elektrik</td><td>Sistem yang menggunakan arus elektrik sama ada arus terus atau arus ulang alik</td></tr><tr><td>II</td><td>Mekanikal</td><td>Gabungan beberapa komponen mekanikal yang berfungsi sebagai penghantar untuk memindahkan suatu sumber gerakan kepada bentuk yang lain</td></tr><tr><td>III</td><td>Elektronik</td><td>Sistem yang menggunakan keupayaan komponen untuk berfungsi secara automatik</td></tr><tr><td>IV</td><td>Kawalan dan pengaturcaraan</td><td>Kaedah kawalan sistem untuk mengurus, mengarah atau mengawal atur tindakan bagi memastikan reka bentuk mekatronik berfungsi secara automatik menggunakan bahasa pengaturcaraan</td></tr></tbody></table></div>", "o": ["I, II dan III", "I, II dan IV", "I, III dan IV", "II, III dan IV"]}, {"s": "Rajah berikut menunjukkan satu elemen mekatronik.", "f": "a3", "s2": "Apakah elemen itu?", "o": ["Kawalan dan pengaturcaraan", "Mekanikal", "Elektronik", "Elektrik"]}, {"s": "Rajah berikut menunjukkan satu produk mekatronik.", "f": "a4", "s2": "Apakah fungsi X ?", "o": ["Membekalkan tenaga elektrik kepada sistem kawalan motor", "Mengurus dan mengarah serta mengawal atur tindakan", "Menerima dan menukar isyarat input dari alat kawalan", "Mengesan sebarang pergerakan"]}, {"s": "Apakah fungsi sistem mekanikal pada pintu gelangsar automatik?", "o": ["Memberi isyarat kepada sistem kawalan", "Gear pada motor membantu memudahkan pergerakan", "Membekalkan tenaga elektrik pada keseluruhan sistem", "Memproses isyarat input dan menghantar isyarat output kepada pemacu"]}, {"s": "Apakah tujuan gambar rajah blok dihasilkan.", "o": ["Menerangkan fungsi elemen pada produk", "Mengenal pasti masalah yang terdapat pada produk", "Memudahkan kerja-kerja pemasangan komponen produk", "Menunjukkan hubung kait antara komponen dan fungsi produk"]}, {"s": "Rajah berikut menunjukkan gambar rajah blok bagi produk mekatronik.", "f": "a7", "s2": "Apakah X ?", "o": ["Pengawal", "Panel kawalan", "Pemproses", "Panel automatik"]}, {"s": "Antara berikut yang manakah peranti output sebuah kereta kawalan jauh?", "o": ["Pemacu motor", "Mikropengawal", "Penderia gerakan", "Panel kawalan jauh"]}, {"s": "Apakah tujuan penambahbaikan dilakukan pada produk mekatronik? .", "o": ["Meniru produk sedia ada", "Mengecilkan saiz produk sedia ada", "Meningkatkan kualiti dan keupayaan produk sedia ada", "Mencantikkan dan mengemaskan lagi produk sedia ada"]}, {"s": "Rajah berikut menunjukkan model palang keselamatan automatik.", "f": "a10", "s2": "Nyatakan komponen yang perlu digabungkan untuk membolehkan palang itu berfungsi secara automatik pada sistem mekanikal.", "o": ["Litar kawalan LDR", "Pembaz", "Penderia suhu", "Penderia inframerah"]}],B=[{"t": "Berikut adalah jenis revolusi industri.\nPadankan pernyataan yang berikut dengan revolusi industri yang sesuai dengan menulis A, B, C, dan D pada petak yang disediakan.", "it": [["Penggunaan meluas reka bentuk elektronik dengan reka bentuk bagi menghasilkan reka bentuk mekatronik", 3], ["Penggunaan reka bentuk mekanikal bagi menggantikan tenaga manusia", 1], ["Penggabungan reka bentuk mekatronik bersama internet benda, data raya, dan pengkomputeran bagi membentuk sistem pengeluaran pintar", 4], ["Penemuan tenaga elektrik yang membolehkan produk dihasilkan dalam kuantiti lebih besar dan cepat", 2]], "o": ["—", "A Revolusi industri 1.0", "B Revolusi industri 2.0", "C Revolusi industri 3.0", "D Revolusi industri 4.0"], "m": 4, "tb": "<div class=\"tw\"><table class=\"tb\"><thead><tr><th></th><th>Jenis revolusi industri</th></tr></thead><tbody><tr><td>A</td><td>Revolusi industri 1.0</td></tr><tr><td>B</td><td>Revolusi industri 2.0</td></tr><tr><td>C</td><td>Revolusi industri 3.0</td></tr><tr><td>D</td><td>Revolusi industri 4.0</td></tr></tbody></table></div>"}, {"t": "Tandakan ( √ ) bagi teras dalam Revolusi Industri 4.0 yang betul dan ( X ) bagi yang salah pada petak yang disediakan.", "it": [["Robot berautonomi", 1], ["Realiti terimbuh", 1], ["Persepaduan sistem", 1], ["Siar raya", 2]], "o": ["—", "√ (betul)", "X (salah)"], "m": 4}, {"t": "Tandakan ( √ ) bagi produk mekatronik yang betul dan ( X ) bagi yang salah pada petak yang disediakan.", "it": [["Mesin basuh automatik", 1], ["Mesin gerudi mudah alih", 2], ["Mesin fotostat", 1], ["Drone", 1]], "o": ["—", "√ (betul)", "X (salah)"], "m": 4}, {"t": "Mekatronik merupakan bidang ilmu yang menggabungkan semua elemen asas kejuruteraan. Namakan elemen-elemen itu.", "it": [["(a)", "a"], ["(b)", "a"], ["(c)", "a"], ["(d)", "a"]], "o": null, "m": 4, "ty": "t", "pats": {"a": ["mekanikal", "elektrik", "elektronik", "kawalan|pengaturcaraan"]}, "sk": "Mekanikal, Elektrik, Elektronik, Kawalan dan pengaturcaraan (mana-mana susunan)"}, {"t": "Nyatakan aspek yang perlu diambil kira dalam sistem elektrik pada produk mekatronik.", "it": [["(a)", "a"], ["(b)", "a"], ["(c)", "a"]], "o": null, "m": 3, "ty": "t", "pats": {"a": ["selamat", "kedudukan|peranti", "sambung"]}, "sk": "Keselamatan; Kedudukan peranti dalam litar; Sambungan litar (mana-mana susunan). Jawapan lain yang munasabah: rujuk guru."}, {"t": "Tandakan ( √ ) bagi sistem mekanikal pada mesin basuh automatik dan ( X ) bagi yang salah pada petak yang disediakan.", "it": [["Gear", 1], ["Galas bebola", 1], ["Papan litar bercetak", 2], ["Takal dan tali sawat", 1]], "o": ["—", "√ (betul)", "X (salah)"], "m": 4}, {"t": "Rajah berikut menunjukkan sistem reka bentuk mekatronik pada pintu gelangsar automatik.\nLengkapkan komponen gambar rajah blok produk itu pada ruang yang disediakan. (Rajah blok: Input → Proses → Output, dengan dua petak pada Output.)", "it": [["Input", "i"], ["Proses", "p"], ["Output (petak 1)", "o"], ["Output (petak 2)", "o"]], "o": null, "m": 4, "ty": "t", "f": "b7", "pats": {"i": ["penderia"], "p": ["mikropengawal|pengawal"], "o": ["motor|pemacu", "takal|tali|sawat"]}, "sk": "Input: Penderia gerakan; Proses: Mikropengawal; Output: Motor AT / Pemacu motor dan Takal dan tali sawat (dua petak Output: mana-mana susunan)"}, {"t": "Maklumat berikut berkaitan dengan elemen mekatronik yang terdapat pada kereta kawalan jauh.\nPadankan maklumat itu dengan elemen mekatronik dengan menulis A, B, C dan D pada ruang jawapan.", "it": [["Sistem Elektrik", 2], ["Sistem Mekanikal", 4], ["Sistem Elektronik", 3], ["Sistem Kawalan dan Pengaturcaraan", 1]], "o": ["—", "A", "B", "C", "D"], "m": 4, "tb": "<div class=\"tw\"><table class=\"tb\"><thead><tr><th></th><th>Maklumat</th></tr></thead><tbody><tr><td>A</td><td>Sistem kawalan yang diatur cara untuk mengawal halaju dan arah putaran motor AT</td></tr><tr><td>B</td><td>Sumber tenaga elektrik untuk menggerakkan motor AT.</td></tr><tr><td>C</td><td>Menerima dan menukarkan isyarat input dari alat kawalan jauh kepada isyarat elektrik bagi memacu motor AT</td></tr><tr><td>D</td><td>Mengurangkan atau meningkatkan halaju dan menambah daya kilas motor</td></tr></tbody></table></div>"}, {"t": "Rajah berikut menunjukkan gambar rajah blok bahagian kereta kawalan jauh yang akan diubah suai bagi membolehkan kereta tersebut mudah dikendalikan di kawasan yang gelap.\nLengkapkan gambar rajah blok itu dengan peranti input dan output yang bersesuaian untuk tujuan pengubahsuaian itu dengan menulis A dan B pada petak yang disediakan.", "it": [["Pembaz", 2], ["Lampu LED", 2], ["Penderia inframerah", 1], ["Perintang peka cahaya (LDR)", 1]], "o": ["—", "A", "B"], "m": 4, "f": "b9"}, {"t": "Susun mengikut urutan yang betul langkah proses penambahbaikan pada kereta kawalan jauh dengan menulis nombor 1 hingga 5 pada petak yang disediakan.\nLangkah 6 diberi.", "it": [["Memilih bahan", 2], ["Membuat lakaran", 1], ["Membuat pengaturcaraan", 3], ["Membuat kemasan", 5], ["Produk akhir", 0, "6"], ["Membina dan memasang", 4]], "o": ["—", "1", "2", "3", "4", "5"], "m": 5}],C=[["1. Rajah berikut menunjukkan satu produk mekatronik iaitu drone.\na) Namakan bahagian atau komponen produk tersebut mengikut elemen mekatronik: Elektrik, Mekanikal, Elektronik, Kawalan dan Pengaturcaraan.", 4, "Elektrik: Bateri / Motor AT\nMekanikal: Antena / Propeller\nElektronik: Alat kawalan / Pengawal kelajuan elektronik / Kamera\nKawalan dan Pengaturcaraan: Pengendali penerbangan\n(1 markah setiap elemen)", "c1"], ["1. b) Hasilkan gambar rajah blok bagi produk tersebut. (drone)", 6, "Input: Alat kawalan\nProses: Mikropengawal\nOutput: Pemacu motor → Motor AT → Propeller berputar, menggerakkan drone, merakam gambar\nBateri membekalkan tenaga; Kamera merakam gambar\n(1 + 1 markah bagi setiap bahagian: Input, Proses, Output)", null], ["2. Rajah berikut menunjukkan pintu pagar automatik.\na) Lengkapkan fungsi elemen mekatronik pada produk tersebut: Elektrik, Mekanikal, Elektronik, Kawalan dan Pengaturcaraan.", 4, "Elektrik: Membekalkan sumber tenaga kepada sistem mekanikal, litar elektronik dan alat kawalan\nMekanikal: Gabungan komponen mekanikal menggerakkan roda pada landasan untuk membuka dan menutup pintu pagar\nElektronik: Panel kawalan tanpa wayar berfungsi untuk mengendalikan pergerakan pintu pagar\nKawalan dan Pengaturcaraan: Mengawal atur tindakan elemen elektrik, elektronik dan mekanikal untuk membuka dan menutup pintu pagar secara automatik\n(1 markah setiap elemen)", "c2"], ["2. b) Penggunaan alat kawalan untuk membuka dan menutup pintu pagar memerlukan tindakan secara manual oleh manusia dan kemungkinan juga alat kawalan mengalami kerosakan. Cadangkan penambahbaikan untuk meningkatkan kefungsian pintu pagar secara automatik sepenuhnya melalui gambar rajah blok.", 6, "Input: Penderia infra merah dan cip pengimbas\nProses: Mikropengawal\nOutput: Pemacu motor → Motor AT → Roda dan landasan → Pintu pagar terbuka dan tertutup\n(1 + 1 markah bagi setiap bahagian: Input, Proses, Output)", null]],K=[3, 1, 2, 2, 1, 3, 0, 0, 2, 3],IM={"a3": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCADlAggDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAAAAIDBAUBBgcI/8QATBAAAQMDAgMDCAUICAUEAwEAAQACAwQFERIhBjFBE1FhBxQiVHGRk9IXMkJSgQgVI2JyobGyFiQzRIKSs9EmNEN0wSc2N+FTY2SE/8QAGgEBAAMBAQEAAAAAAAAAAAAAAAECAwQFBv/EACsRAAICAQQBBAEEAwEBAAAAAAABAhEDBBIhMQUTFEFRIhUyUmFCcYGxwf/aAAwDAQACEQMRAD8A9loQos80jJi0OwBjopSsrKSj2SkKKJ3n7X7kpsxPVWcGV9REhCZEp70rWVWiVNMcQkaishygnchSEA5QhYEIQgBCEIAQhCAEIQgBCEIAQhCAEIQgBCEIAQhCAEIQgBCEIAQhCAEIQgBCEIAQhCAEIQgBCEIAQhCAEIQgsEIQgBCCsZSiLMoWMrBcgsUhILu5Y1nvCmiNyHEJvWkGU96UN6H0KMZn55pLqh4HPf2K2xjciWhQfOZMc8fgkOq5R9v9wUrE2N6LFCqjW1HMPGPYFiGtqHVETC/Ic4A7BT6MhvRbIQhZFgVbWuIq3AeH8FZKouLsVrx7P4LXF2Z5ejOcbpbHbKO1yW12/Nb0YEjW5Ka89UyDtzSxjHNUcSUSGuynA5RWnxKda5ZtFh9rksFMt3CyOao0XjIdQkhZCqap2ZQhCAEIQgBCEE4QAhCNlFgELD3NYNT3Bo7ycKBUXqzwA9tdaGPHPVUMH/lLBYIVG/izhhpw7iG1D/8A1M/3S4+J+HZAOzv1tdnuqmf7pYLlCjU1ZR1IBp6qGb9iQO/gVIwFNgyhYyEbIDKEIQAhGR3oPJACFjCMIDKEBCAELGx3yjbvQGUICEAIQhACEIQAhBIHVGQgMFCChTRALBWUIVYhx2WGn2pTljCko2zCEIPgiIMP6JBIG+3vSjumyrIUZc8kbJkkjJzulvxhNOwtEiLoT2js7lYc/KJNONk1IR3rRIhsyXkHdJecgppxHRJLtjyUkow532clLoyPOod/thMF7kqicfPYQcfXH8VD6LI2VCAhcZsCprm7FbIPZ/BXKoLs4i4yfh/ALXF+4zy9GGuS2uUVrnE+CdY5dBgSAT3p1rsDmozXeKW const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={n:"",k:"",a:Array(10).fill(-1),b:{},c:{},m:{}},sec=0;
const save=()=>{try{localStorage.setItem("rbt3b1",JSON.stringify(st))}catch(e){}};
try{let s=JSON.parse(localStorage.getItem("rbt3b1")||"null");if(s&&s.a&&s.a.length==10)st=s}catch(e){}
const fig=(k,c)=>k?`<figure><img src="${IM[k]}" alt="${E(c)}"></figure>`:"";
const nA=()=>st.a.filter(x=>x>=0).length,nB=()=>Object.values(st.b).filter(v=>v&&v!=0).length,nC=()=>Object.values(st.c).filter(x=>x.trim()).length;
function prog(){let d=nA()+nB()+nC();$("#prog").textContent=d+" item dijawab";$("#pb").style.width=Math.min(100,d/54*100)+"%"}
function aCard(i,rev){let q=A[i],h=`<div class="card"><b>Soalan ${i+1}</b><pre>${E(q.s)}</pre>${fig(q.f,"Rajah soalan "+(i+1))}${q.t||""}${q.s2?`<pre>${E(q.s2)}</pre>`:""}`;
return h+q.o.map((o,j)=>{if(rev){let c=j==K[i]?"ok":st.a[i]==j?"no":"";return`<div class="opt ${c}"><b>${L[j]}</b><span>${E(o)}${j==K[i]?" ✓":st.a[i]==j?" ✗ (jawapan anda)":""}</span></div>`}
return`<label class="opt"><input type="radio" name="a${i}" data-i="${i}" data-j="${j}" ${st.a[i]==j?"checked":""}><b>${L[j]}</b><span>${E(o)}</span></label>`}).join("")+`</div>`}
function bCard(i){let q=B[i],h=`<div class="card"><b>Soalan ${i+1}</b> <span class="mut">[${q.m} markah]</span><pre>${E(q.t)}</pre>${q.tb||""}${fig(q.f,"Rajah soalan B"+(i+1))}`;
q.it.forEach((r,j)=>{let k=i+"_"+j,v=st.b[k];h+=`<div class="row"><span>${E(r[0])}</span>`+(r[2]?`<b>${E(r[2])}</b>`:q.ty=="t"?`<input type="text" maxlength="120" data-bt="${k}" value="${E(v||"")}">`:`<select data-b="${k}">${q.o.map((o,x)=>`<option value="${x}" ${(v||0)==x?"selected":""}>${E(o)}</option>`).join("")}</select>`)+`</div>`});return h+`</div>`}
function cCard(i){let q=C[i];return`<div class="card"><pre>${E(q[0])}</pre>${fig(q[3],"Rajah soalan C")}<span class="mut">[${q[1]} markah]</span><textarea rows="5" data-c="${i}">${E(st.c[i]||"")}</textarea></div>`}
function render(){document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("on",i==sec));
$("#body").innerHTML=sec==0?A.map((q,i)=>aCard(i,0)).join(""):sec==1?B.map((q,i)=>bCard(i)).join(""):`<div class="card mut">Taip jawapan anda. Selepas hantar, bandingkan dengan skema dan beri markah sendiri.</div>`+C.map((q,i)=>cCard(i)).join("");prog()}
const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms(a.filter((_,j)=>j!=i)).map(p=>[x,...p]));
function bScore(i){let q=B[i],s=0;
if(q.ty=="t"){let g={};q.it.forEach((r,j)=>(g[r[1]]=g[r[1]]||[]).push(st.b[i+"_"+j]||""));
for(let k in g){let best=0;perms(q.pats[k]).forEach(p=>{let c=0;g[k].forEach((v,x)=>{if(new RegExp(p[x],"i").test(v))c++});best=Math.max(best,c)});s+=best}return s}
q.it.forEach((r,j)=>{if(!r[2]&&(st.b[i+"_"+j]||0)==r[1])s++});return s}
function tally(){let a=A.reduce((s,q,i)=>s+(st.a[i]==K[i]?1:0),0),b=B.reduce((s,q,i)=>s+bScore(i),0),c=C.reduce((s,q,i)=>s+(st.m[i]||0),0);
$("#tot").textContent=(a+b+c)+" / 70 markah ("+Math.round((a+b+c)/.7)+"%)";$("#brk").textContent=`Bahagian A: ${a}/10 · Bahagian B: ${b}/40 · Bahagian C: ${c}/20 (markah sendiri)`}
document.addEventListener("change",e=>{let t=e.target;if(t.dataset.i!=null)st.a[t.dataset.i]=+t.dataset.j;if(t.dataset.b)st.b[t.dataset.b]=+t.value;if(t.dataset.m!=null){st.m[t.dataset.m]=Math.max(0,Math.min(+t.max,+t.value||0));tally()}save();prog()});
document.addEventListener("input",e=>{let t=e.target;if(t.dataset.c!=null)st.c[t.dataset.c]=t.value;if(t.dataset.bt)st.b[t.dataset.bt]=t.value;save();prog()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sec=+b.dataset.s;render();scrollTo(0,0)});
$("#go").onclick=()=>{let n=$("#nm").value.trim(),k=$("#kl").value.trim();if(!n){alert("Sila masukkan nama murid.");$("#nm").focus();return}if(!k){alert("Sila masukkan kelas.");$("#kl").focus();return}st.n=n;st.k=k;save();begin()};
function begin(){$("#start").classList.add("hid");$("#quiz").classList.remove("hid");$("#who").textContent="Murid: "+st.n+" ("+st.k+")";render()}
$("#sub").onclick=()=>{let u=10-nA();if(u&&!confirm("Masih ada "+u+" soalan Bahagian A belum dijawab. Hantar juga?"))return;
$("#quiz").classList.add("hid");$("#res").classList.remove("hid");$("#who2").textContent="Nama murid: "+st.n+" · Kelas: "+st.k;
let h=`<div class="card"><h3>Bahagian A</h3></div>`+A.map((q,i)=>aCard(i,1)).join("")+`<div class="card"><h3>Bahagian B</h3>`+B.map((q,i)=>`<div class="row" style="grid-template-columns:1fr auto"><span><b>Soalan ${i+1}</b><br>`+q.it.map((r,j)=>{let v=st.b[i+"_"+j];if(r[2])return"";if(q.ty=="t")return`• ${E(r[0])}: anda <i>${E(v||"—")}</i><br>`;let ok=(v||0)==r[1];return`<span class="${ok?"ok":"bad"}">${ok?"✓":"✗"}</span> ${E(r[0].slice(0,60))} — anda: ${E(q.o[v||0])}${ok?"":", skema: "+E(q.o[r[1]])}<br>`}).join("")+(q.sk?`<span class="mut">Skema: ${E(q.sk)}</span>`:"")+`</span><b>${bScore(i)}/${q.m}</b></div>`).join("")+`</div><div class="card"><h3>Bahagian C — semak sendiri</h3>`+C.map((q,i)=>`<div style="border-top:1px solid var(--line);padding:8px 0"><b>${E(q[0].slice(0,80))}…</b><pre><i>Jawapan anda:</i> ${E(st.c[i]||"—")}</pre><pre><i>Skema:</i> ${E(q[2])}</pre>Markah anda (0–${q[1]}): <input type="number" min="0" max="${q[1]}" data-m="${i}" value="${st.m[i]||0}" style="width:80px"></div>`).join("")+`</div>`;
$("#rev").innerHTML=h;tally();scrollTo(0,0)};
$("#again").onclick=()=>{if(!confirm("Padam jawapan dan mula semula?"))return;st={n:st.n,k:st.k,a:Array(10).fill(-1),b:{},c:{},m:{}};save();$("#res").classList.add("hid");sec=0;begin()};
if(st.n)$("#nm").value=st.n;if(st.k)$("#kl").value=st.k;
</script></body></html>
